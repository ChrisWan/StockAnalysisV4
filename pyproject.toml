[project]
name = "stock-analysis-v4"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1",
    "ib-async>=2.1",
    "numpy>=2.5",
    "pandas>=3.0",
    "requests>=2.31",
    "yfinance>=1.5",
]

[dependency-groups]
dev = [
    "playwright>=1.62.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
